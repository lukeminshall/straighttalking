# Netlify deploy config for Straight Talking (Vite + React Router SPA).
[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: serve index.html for any path so /feedback, /app,
# /outcomes, /board etc. resolve instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
